<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniAgent Synergy OS</title>
    <script>
      // SPA fallback for GitHub Pages.
      // GitHub Pages serves this file for any unknown path. We stash the
      // original deep-link path in sessionStorage and bounce the user to
      // the app shell, which restores the URL on load.
      (function () {
        try {
          // Auto-derive the repo base from the URL so this works whether the
          // site lives at /omniagent.github.io/ or at the user/org root.
          var segments = window.location.pathname.split("/").filter(Boolean);
          var repoBase = segments.length > 0 ? "/" + segments[0] : "";

          var path = window.location.pathname;
          if (repoBase && path.indexOf(repoBase) === 0) {
            path = path.slice(repoBase.length);
          }

          var redirect =
            (path || "/") + window.location.search + window.location.hash;

          sessionStorage.setItem("spa-redirect", redirect);
          window.location.replace(repoBase + "/");
        } catch (e) {
          window.location.replace("/");
        }
      })();
    </script>
  </head>
  <body>
    <p style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
      Redirecting to OmniAgent Synergy OS…
    </p>
  </body>
</html>
